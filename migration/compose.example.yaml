# DESIGN TEMPLATE ONLY. Future ported image/auth/storage required. Do not deploy as-is.
services:
  app:
    image: fp-mission-control:ported
    restart: unless-stopped
    user: "10001:10001"
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://${APP_DOMAIN:?Set an owned staging domain}
      DATABASE_PATH: /data/mission-control.sqlite
      SESSION_SECRET_FILE: /run/secrets/session_secret
    volumes:
      - app_data:/data
    secrets:
      - session_secret
    healthcheck:
      # Implement /healthz in the future port; it does not exist in the source MVP.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set an owned staging domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  app_data:
  caddy_data:
  caddy_config:
secrets:
  session_secret:
    file: ./secrets/session_secret
